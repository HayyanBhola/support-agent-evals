[project]
name = "support-agent-evals"
version = "0.1.0"
description = "Evaluation platform for the GlowCare AI customer support agent."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "diskcache>=5.6.3",
    "httpx>=0.28.1",
    "hydra-core>=1.3.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "mlflow==3.17.1",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-openpyxl>=3.1.5.20260827",
    "types-pyyaml>=6.0.12.20260906",
]
labeling = [
    "streamlit>=1.65.0",
]
snapshot = [
    "chromadb==1.5.9",
]

[project.scripts]
evalkit = "evalkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["agent_snapshot"]  # a pure copy of the agent's code: never lint or format it

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/evalkit", "app"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: needs the real agent running (run with: pytest -m live)"]

# Coverage is measured for the whole package; the gates are per module group (see Makefile):
# 100% on schemas/io/hashing, 90% on adapters/cache/runner/importers/generation/review.
[tool.coverage.run]
branch = true
include = ["*/evalkit/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
